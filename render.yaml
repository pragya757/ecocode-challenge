databases:
  - name: ecocode-db
    plan: free
    databaseName: ecocode
    user: ecocode_user

services:
  - type: web
    name: ecocode-challenge
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: cd backend && gunicorn -w 2 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ecocode-db
          property: connectionString
      - key: SECRET_KEY
        value: ecocode-production-super-secret-key-2026
      - key: JWT_SECRET_KEY
        value: ecocode-jwt-production-secret-key-2026
      - key: PYTHON_VERSION
        value: 3.11.9
