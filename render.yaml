services:
  - type: web
    name: ecocode-challenge
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: cd backend && gunicorn -w 2 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
