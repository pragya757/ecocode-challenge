<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="leafGrad" x1="16" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a3e635" />
      <stop offset="45%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="bracketGrad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="circuitGrad" x1="20" y1="20" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#bef264" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Pill Rounded Container -->
  <rect width="64" height="64" rx="16" fill="#09131f" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#10b981" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Left Curly Bracket { -->
  <path d="M19 14 C13 14 11 19 11 25 C11 29 8 32 5 32 C8 32 11 35 11 39 C11 45 13 50 19 50" 
        stroke="url(#bracketGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Right Curly Bracket } -->
  <path d="M45 14 C51 14 53 19 53 25 C53 29 56 32 59 32 C56 32 53 35 53 39 C53 45 51 50 45 50" 
        stroke="url(#bracketGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Circuit nodes on bracket hinges -->
  <circle cx="5" cy="32" r="2.5" fill="#a3e635" filter="url(#glow)" />
  <circle cx="59" cy="32" r="2.5" fill="#a3e635" filter="url(#glow)" />

  <!-- Central Dynamic Green Eco Leaf -->
  <path d="M32 12 C21 19 19 36 32 48 C45 36 43 19 32 12 Z" 
        fill="url(#leafGrad)" />

  <!-- Leaf Central Stem & Circuit Traces -->
  <path d="M32 47 L32 20" stroke="#042f1a" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Circuit Branch Left -->
  <path d="M32 35 L26 29 L23 29" stroke="#042f1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="22" cy="29" r="2" fill="#bef264" />

  <!-- Circuit Branch Right -->
  <path d="M32 28 L38 23 L41 23" stroke="#042f1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="42" cy="23" r="2" fill="#bef264" />

  <!-- Top Apex Energy Glow Node -->
  <circle cx="32" cy="14" r="2" fill="#ffffff" filter="url(#glow)" />
</svg>
